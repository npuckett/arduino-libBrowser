# Deliberately malformed fixture for parser regression tests.
#
# This fixture exists to trip up naive parsers that accept any text before
# the first '=' as a key. The parser MUST reject every line below this
# comment and produce ONLY the two valid keys: `name` and `version`.
#
# Real-world garbage that has appeared in Arduino libraries includes:
#   - Diff/patch debris left from sed scripts
#   - Shell prompt lines pasted in by accident
#   - Keys containing spaces, hyphens, or starting with digits
#   - Empty keys (lines starting with '=')
#   - Lines without any '=' at all

name=Valid Library
version=1.0.0

# --- garbage starts here ---
1bad=starts with digit
9lives=also starts with digit
0=zero key
bad-key=hyphen is illegal
bad.key=dot is illegal
bad key=space is illegal
bad!key=bang is illegal
bad@key=at is illegal
bad/key=slash is illegal
bad:key=colon is illegal
=empty key
keyonly
just=two=equals=is fine actually, only first equals splits
# ^^ this line above is valid; the parser must split on the FIRST '=' only.

[section header that is not a key=value pair]
$also=not a valid key
€euro=not a valid key
trailing equals=value=