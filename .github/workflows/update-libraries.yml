name: Update Arduino Libraries (Daily)

on:
  schedule:
    # Run every day at 2 AM EST (7 AM UTC)
    - cron: '0 7 * * *'
  workflow_dispatch: # Allow manual runs

jobs:
  incremental-update:
    runs-on: ubuntu-latest
    timeout-minutes: 45  # Increased timeout for registry-based processing
    
    # Add GitHub Pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    permissions:
      contents: write  # Required to push changes to repository
      pages: write     # Required to trigger GitHub Pages deployment
      id-token: write  # Required for GitHub Pages deployment
      actions: write   # Required for workflow dispatch
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true
        
      - name: Setup PowerShell
        shell: pwsh
        run: |
          Write-Host "PowerShell ready for incremental Arduino library updates"
          
      - name: Run incremental library update
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}  # Use built-in GitHub token
        run: |
          # Registry-based incremental approach: check Arduino Registry for updates
          Write-Host "Starting incremental Arduino library update from official registry"
          
          # Enhanced rate limiting and error handling
          $rateLimitDelay = 1  # seconds between requests
          $maxRetries = 1  # Only 1 retry for daily runs - skip errors quickly
          
          # Load existing libraries for comparison
          $existingLibraries = @()
          $existingRepoMap = @{}
          if (Test-Path "output/libraries.json") {
            $existingData = Get-Content "output/libraries.json" | ConvertFrom-Json
            $existingLibraries = $existingData.libraries
            $existingLibraries | ForEach-Object { 
              $existingRepoMap[$_.repository_name] = $_ 
            }
            Write-Host "Found $($existingLibraries.Count) existing libraries for comparison"
          } else {
            Write-Host "No existing libraries found, will process all registry entries"
          }
          
          # Load Arduino Registry
          if (-not (Test-Path "input/repositories.txt")) {
            Write-Host "ERROR: Arduino Registry file not found at input/repositories.txt"
            exit 1
          }
          
          $registryUrls = Get-Content "input/repositories.txt" | Where-Object { $_ -match "^https://github.com/" }
          Write-Host "Arduino Registry contains $($registryUrls.Count) repositories"
          
          # GitHub API headers with authentication
          $headers = @{
            'User-Agent' = 'Arduino-Library-Browser-Daily'
            'Accept' = 'application/vnd.github.v3+json'
            'Authorization' = "token $env:GITHUB_TOKEN"
          }
          
          # Process repositories in batches for efficiency
          $newLibraries = @()
          $updatedLibraries = @()
          $unchangedCount = 0
          $errorCount = 0
          $processedCount = 0
          $batchSize = 50  # Conservative batch size for daily runs
          $maxDailyProcessCount = 1000  # Process more libraries but with better efficiency
          
          # Calculate time threshold for "recent" updates (last 3 days to catch weekend updates)
          $threeDaysAgo = (Get-Date).AddDays(-3)
          
          # Smart processing: prioritize recently updated repositories
          # First, check which repos have been updated recently using batch API calls
          Write-Host "Pre-filtering repositories for recent activity..."
          $recentlyActiveRepos = @()
          $allRepoNames = @()
          
          # Extract all repo names from registry
          foreach ($url in $registryUrls) {
            if ($url -match "https://github.com/([^/]+)/([^/]+)") {
              $allRepoNames += "$($matches[1])/$($matches[2])"
            }
          }
          
          Write-Host "Total repositories in registry: $($allRepoNames.Count)"
          
          # Process all repositories, but with efficient filtering
          for ($i = 0; $i -lt $allRepoNames.Count; $i++) {
            $repoName = $allRepoNames[$i]
            $processedCount++
            
            # Check existing library data first for quick filtering
            $existingLibrary = $existingRepoMap[$repoName]
            
            # Skip API call for libraries we know haven't changed recently
            if ($existingLibrary) {
              try {
                $existingUpdatedAt = [DateTime]::Parse($existingLibrary.github_updated_at)
                $daysSinceUpdate = (Get-Date) - $existingUpdatedAt
                
                # Skip libraries that haven't been updated in over 30 days (they're unlikely to change)
                if ($daysSinceUpdate.TotalDays -gt 30) {
                  $unchangedCount++
                  if ($processedCount % 500 -eq 0) {
                    Write-Host "Progress: $processedCount/$($allRepoNames.Count) checked, $unchangedCount unchanged, $($newLibraries.Count) new, $($updatedLibraries.Count) updated"
                  }
                  continue
                }
              } catch {
                # If we can't parse the date, we should check it
              }
            }
            
            # Get repository metadata from GitHub API
            $repoApiUrl = "https://api.github.com/repos/$repoName"
            $retryCount = 0
            $repoData = $null
            
            do {
              try {
                Start-Sleep -Seconds $rateLimitDelay
                $repoData = Invoke-RestMethod -Uri $repoApiUrl -Headers $headers -ErrorAction Stop
                break
              } catch {
                $retryCount++
                $waitTime = [math]::Pow(2, $retryCount) * 2
                Write-Host "Error getting repo data for $repoName (attempt $retryCount): $($_.Exception.Message)"
                
                if ($retryCount -ge $maxRetries) {
                  Write-Host "Max retries exceeded for $repoName, skipping"
                  $errorCount++
                  break
                }
                Start-Sleep -Seconds $waitTime
              }
            } while ($retryCount -lt $maxRetries)
            
            if (-not $repoData) {
              continue  # Skip this repo if we couldn't get data
            }
            
            # Check if this library needs updating
            $isNewLibrary = -not $existingLibrary
            $repoUpdatedAt = [DateTime]::Parse($repoData.updated_at)
            $isRecentlyUpdated = $repoUpdatedAt -gt $threeDaysAgo
            
            # For existing libraries, check if GitHub updated_at has changed
            $needsUpdate = $false
            if ($existingLibrary) {
              try {
                $existingUpdatedAt = [DateTime]::Parse($existingLibrary.github_updated_at)
                $needsUpdate = $repoUpdatedAt -gt $existingUpdatedAt
              } catch {
                # If we can't parse the existing date, assume it needs update
                $needsUpdate = $true
              }
            }
            
            if ($isNewLibrary) {
              Write-Host "New library: $repoName (created: $($repoData.created_at))"
            } elseif ($needsUpdate) {
              Write-Host "Updated library: $repoName (was: $($existingLibrary.github_updated_at), now: $($repoData.updated_at))"
            } else {
              $unchangedCount++
              if ($processedCount % 500 -eq 0) {
                Write-Host "Progress: $processedCount/$($allRepoNames.Count) processed, $unchangedCount unchanged, $($newLibraries.Count) new, $($updatedLibraries.Count) updated"
              }
              continue  # Skip unchanged libraries
            }
            
            # Download and parse library.properties
            $propertiesUrls = @(
              "https://raw.githubusercontent.com/$repoName/master/library.properties",
              "https://raw.githubusercontent.com/$repoName/main/library.properties"
            )
            
            $properties = $null
            foreach ($propertiesUrl in $propertiesUrls) {
              try {
                Start-Sleep -Milliseconds 500
                $propertiesContent = Invoke-RestMethod -Uri $propertiesUrl -ErrorAction Stop
                $properties = $propertiesContent
                break
              } catch {
                # Skip to next URL on error (no retries for daily runs)
                continue
              }
            }
            
            if (-not $properties) {
              Write-Host "No library.properties found for $repoName, skipping"
              $errorCount++
              continue
            }
            
            # Create library info object
            $libraryInfo = @{
              repository_name = $repoName
              repository_url = $repoData.html_url
              github_updated_at = $repoData.updated_at
              github_created_at = $repoData.created_at
              github_stars = $repoData.stargazers_count
              github_forks = $repoData.forks_count
              processed_at = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            }
            
            # Parse properties file
            $properties -split "`n" | ForEach-Object {
              $line = $_.Trim()
              if ($line -and $line.Contains('=')) {
                $key, $value = $line -split '=', 2
                $libraryInfo[$key.Trim()] = $value.Trim()
              }
            }
            
            # Add to appropriate list
            if ($isNewLibrary) {
              $newLibraries += [PSCustomObject]$libraryInfo
            } else {
              $updatedLibraries += [PSCustomObject]$libraryInfo
            }
            
            # Rate limiting - pause every batch
            if ($processedCount % $batchSize -eq 0) {
              Write-Host "Batch complete: $processedCount processed. Brief pause for rate limiting..."
              Start-Sleep -Seconds 5
            }
          }
          
          Write-Host "Processing complete:"
          Write-Host "- Repositories processed: $processedCount"
          Write-Host "- New libraries: $($newLibraries.Count)"
          Write-Host "- Updated libraries: $($updatedLibraries.Count)"
          Write-Host "- Unchanged libraries: $unchangedCount"
          Write-Host "- Errors: $errorCount"
          
          # Merge with existing libraries
          if ($existingLibraries.Count -gt 0) {
            # Remove old versions of updated libraries
            $updatedRepoNames = ($newLibraries + $updatedLibraries) | ForEach-Object { $_.repository_name }
            $keptLibraries = $existingLibraries | Where-Object { 
              $_.repository_name -notin $updatedRepoNames
            }
            $allLibraries = $keptLibraries + $newLibraries + $updatedLibraries
            Write-Host "Merged: $($keptLibraries.Count) kept + $($newLibraries.Count) new + $($updatedLibraries.Count) updated = $($allLibraries.Count) total"
          } else {
            $allLibraries = $newLibraries + $updatedLibraries
            Write-Host "First run: $($allLibraries.Count) total libraries"
          }
          
          # Update Staff Pick configuration
          $currentDate = Get-Date -Format "yyyy-MM-dd"
          Write-Host "Checking Staff Pick configuration for: $currentDate"
          
          # Check if auto-update is enabled
          $shouldUpdateStaffPick = $true
          if (Test-Path "staff-pick-config.json") {
            try {
              $existingConfig = Get-Content "staff-pick-config.json" | ConvertFrom-Json
              if ($existingConfig.auto_update -eq $false) {
                Write-Host "Staff Pick auto-update is disabled. Preserving current selection: $($existingConfig.specific_library)"
                $shouldUpdateStaffPick = $false
              }
            } catch {
              Write-Host "Error reading existing Staff Pick config, will create new one"
            }
          }
          
          if ($shouldUpdateStaffPick) {
            # Use date as seed for deterministic random selection
            $dateHash = ($currentDate.ToCharArray() | ForEach-Object { [int]$_ } | Measure-Object -Sum).Sum
            $libraryIndex = $dateHash % $allLibraries.Count
            $selectedLibrary = $allLibraries[$libraryIndex]
            
            Write-Host "Staff Pick selected: $($selectedLibrary.name) by $($selectedLibrary.author)"
            
            # Update staff-pick-config.json
            $staffPickConfig = @{
              enabled = $true
              auto_update = $true
              picker_name = "Staff"
              picker_url = "https://github.com/npuckett"
              specific_library = $selectedLibrary.name
              selected_date = $currentDate
              last_updated = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
              notes = "Automatically updated by daily workflow"
            }
            
            $staffPickConfig | ConvertTo-Json -Depth 5 | Set-Content "staff-pick-config.json" -Encoding UTF8
            Write-Host "Updated staff-pick-config.json with selected library: $($selectedLibrary.name)"
          }
          
          # Create enhanced output structure with explicit ordering
          $outputData = [ordered]@{
            enhanced_at = (Get-Date -Format "yyyy-MM-ddTHH:mm:ssZ")
            total_libraries = $allLibraries.Count
            changes_in_last_update = @{
              new_libraries = $newLibraries.Count
              updated_libraries = $updatedLibraries.Count
              total_changes = $newLibraries.Count + $updatedLibraries.Count
            }
            libraries = $allLibraries | Sort-Object name
          }
          
          # Save to file
          $jsonOutput = $outputData | ConvertTo-Json -Depth 10
          $jsonOutput | Set-Content "output/libraries.json" -Encoding UTF8
          
          # Debug: Verify the structure was created correctly
          Write-Host "Generated JSON structure includes enhanced_at: $($outputData.enhanced_at)"
          Write-Host "Top-level keys in output: $($outputData.Keys -join ', ')"
          
          Write-Host "Updated libraries.json with $($allLibraries.Count) total libraries"
          Write-Host "Changes: $($newLibraries.Count + $updatedLibraries.Count) new/updated libraries"
        
      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Daily Update"
          
          # Debug: Check if token is available (first 4 characters only for security)
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "Token is available (length: ${#GITHUB_TOKEN})"
            echo "Token starts with: ${GITHUB_TOKEN:0:4}****"
          else
            echo "ERROR: GITHUB_TOKEN secret is not set!"
            exit 1
          fi
          
          # Configure git to use the GitHub Token for authentication
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          # Debug: Show current remote URL (without token)
          echo "Remote URL configured for repository: ${{ github.repository }}"
          
          git add output/libraries.json staff-pick-config.json
          
          # Create a deployment trigger to ensure GitHub Pages redeploys
          echo "$(date '+%Y-%m-%d %H:%M:%S UTC') - Library update completed" > .deployment-trigger
          git add .deployment-trigger
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            # Create meaningful commit message
            NEW_COUNT=$(grep -o '"new_libraries": [0-9]*' output/libraries.json | grep -o '[0-9]*' || echo "0")
            UPDATED_COUNT=$(grep -o '"updated_libraries": [0-9]*' output/libraries.json | grep -o '[0-9]*' || echo "0")
            TOTAL_COUNT=$(grep -o '"total_libraries": [0-9]*' output/libraries.json | grep -o '[0-9]*' || echo "0")
            
            git commit -m "Daily update: +${NEW_COUNT} new, ${UPDATED_COUNT} updated libraries (${TOTAL_COUNT} total) - $(date '+%Y-%m-%d %H:%M UTC')"
            
            # Pull latest changes before pushing to handle any conflicts
            echo "Pulling latest changes to avoid conflicts..."
            git pull --rebase origin main || {
              echo "Failed to pull and rebase. Attempting merge strategy..."
              git pull origin main --allow-unrelated-histories || {
                echo "ERROR: Unable to pull latest changes. Manual intervention required."
                exit 1
              }
            }
            
            git push
            echo "Libraries updated and pushed to repository"
          fi

      - name: Deploy to GitHub Pages
        if: success()  # Only deploy if library update succeeded
        run: echo "Setting up GitHub Pages deployment..."
      
      - name: Setup Pages
        if: success()
        uses: actions/configure-pages@v4
      
      - name: Upload GitHub Pages artifact
        if: success()
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      
      - name: Deploy to GitHub Pages
        if: success()
        id: deployment
        uses: actions/deploy-pages@v4
        
      - name: Deployment completion
        if: success()
        run: |
          echo "✅ Library update and GitHub Pages deployment completed successfully!"
          echo "🔗 Site URL: ${{ steps.deployment.outputs.page_url }}"
          echo "📊 Updated ${UPDATED_COUNT:-103} libraries"
