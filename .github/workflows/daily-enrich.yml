name: Daily Enrichment (GitHub API + ETag)

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

concurrency:
  group: daily-enrich-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  enrich:
    name: Enrich with GitHub metadata
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run daily enrichment pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm pipeline:daily

      - name: Detect and commit changes
        id: commit
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action - Daily Enrich"

          if [ -n "$(git status --porcelain)" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
            git add -A
            git status --short
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          fi

      - name: Commit and push
        if: steps.commit.outputs.changes == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git

          CHANGED=$(git diff --cached --name-only | wc -l | tr -d ' ')
          git commit -m "Daily enrich: GitHub metadata refresh ($(date -u '+%Y-%m-%d %H:%M UTC')) [${CHANGED} files]"

          git pull --rebase origin "$GITHUB_REF_NAME" || git pull origin "$GITHUB_REF_NAME" --allow-unrelated-histories || {
            echo "::error::Failed to pull latest changes before push"
            exit 1
          }
          git push