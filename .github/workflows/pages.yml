name: Deploy GitHub Pages

# Triggers:
#   push             — real (human/PAT) pushes to main. NOTE: pushes made with
#                      the repo's default GITHUB_TOKEN do NOT fire the `push`
#                      event, so this alone does not cover the data workflows
#                      below (they all commit via GITHUB_TOKEN).
#   workflow_run     — bridges that gap: fires when one of the three scheduled
#                      data workflows (hourly-sync, daily-enrich, weekly-stats)
#                      completes, so token-pushed data updates actually deploy.
#
# Earlier this also used workflow_run with `cancel-in-progress: false`, which
# queued a SECOND deploy on top of the push deploy — the root cause of the
# recurring "transient Pages backend failures". The concurrency group below
# (with cancel-in-progress: true) now makes both triggers safe to keep.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ["Hourly Sync (library_index.json.gz)", "Daily Enrichment (GitHub API + ETag)", "Weekly Stats Rollup"]
    types: [completed]
    branches: [main]

concurrency:
  group: pages-${{ github.ref }}
  # Cancel a stale in-flight deploy when a newer push arrives. Previously
  # false, which queued back-to-back deploys against the same environment.
  cancel-in-progress: true

permissions: {}

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # When triggered via workflow_run, only deploy if the upstream data
    # workflow actually succeeded — a failed sync/enrich run shouldn't kick
    # off a deploy. (Push and workflow_dispatch runs are unaffected.)
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        # Default fetch-depth (1) is enough — this is a static deploy that
        # only needs the working tree, not git history.

      - name: Setup Pages
        uses: actions/configure-pages@v4

      # Stage only the served paths into a clean directory, so we don't ship
      # ~25MB of state/, the lockfile, test fixtures, or dev-screenshots/ to
      # Pages. Smaller artifact -> faster, more reliable deploys.
      - name: Stage deploy artifact
        run: |
          mkdir -p _site
          # Top-level static assets
          cp index.html style.css activity.css _site/ 2>/dev/null || true
          cp favicon.png robots.txt sitemap.xml _site/ 2>/dev/null || true
          cp editors.json themes.json _site/ 2>/dev/null || true
          cp .nojekyll _site/ 2>/dev/null || true
          # Directories the site depends on
          cp -R output _site/output
          cp -R images _site/images 2>/dev/null || true
          echo "--- staged tree ---"
          find _site -maxdepth 1 -mindepth 1 | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy-1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deploy-1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before final retry
        if: steps.deploy-2.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (final attempt)
        id: deploy-3
        if: steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: success()
        run: |
          if [ "${{ steps.deploy-1.outcome }}" = "success" ]; then
            echo "✅ Succeeded on attempt 1"
            echo "🔗 Site URL: ${{ steps.deploy-1.outputs.page_url }}"
          elif [ "${{ steps.deploy-2.outcome }}" = "success" ]; then
            echo "✅ Succeeded on attempt 2 (after retry)"
            echo "🔗 Site URL: ${{ steps.deploy-2.outputs.page_url }}"
          else
            echo "✅ Succeeded on attempt 3 (after final retry)"
            echo "🔗 Site URL: ${{ steps.deploy-3.outputs.page_url }}"
          fi