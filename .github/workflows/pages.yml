name: Deploy GitHub Pages

on:
  workflow_run:
    workflows:
      - 'Hourly Sync (library_index.json.gz)'
      - 'Daily Enrichment (GitHub API + ETag)'
      - 'Weekly Stats Rollup'
    types:
      - completed
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      (github.event_name == 'push') ||
      (github.event_name == 'workflow_dispatch') ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    permissions:
      pages: write
      id-token: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages (attempt 1)
        id: deploy-1
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before retry
        if: steps.deploy-1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (attempt 2)
        id: deploy-2
        if: steps.deploy-1.outcome == 'failure'
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before final retry
        if: steps.deploy-2.outcome == 'failure'
        run: sleep 120

      - name: Deploy to GitHub Pages (final attempt)
        id: deploy-3
        if: steps.deploy-2.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Deployment summary
        if: success()
        run: |
          if [ "${{ steps.deploy-1.outcome }}" = "success" ]; then
            echo "✅ Succeeded on attempt 1"
            echo "🔗 Site URL: ${{ steps.deploy-1.outputs.page_url }}"
          elif [ "${{ steps.deploy-2.outcome }}" = "success" ]; then
            echo "✅ Succeeded on attempt 2 (after retry)"
            echo "🔗 Site URL: ${{ steps.deploy-2.outputs.page_url }}"
          else
            echo "✅ Succeeded on attempt 3 (after final retry)"
            echo "🔗 Site URL: ${{ steps.deploy-3.outputs.page_url }}"
          fi